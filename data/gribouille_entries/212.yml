  <section id="intro"><div class="trix-content">
    <div>Cette semaine, on vous a mis une surprise... Une courge spaghetti ! Quel.le.s veinard.e.s ! On savait que vous aviez envie de courges... Plus sérieusement, elles étaient prêtes 1,5 mois en avance et elles ont une maladie qui fait qu'elle ne se conserveront pas (Pectobacterium si vous voulez le nom de la coupable)<br>La courge spaghetti n'a pas beaucoup de gout, mais elle a une texture formidable ! Une fois qu'elle est cuite, passez dedans avec une fourchette er elle s'effilochera ! Incroyable</div>
  </div>
  </section>
  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>Tomates<br>Tomates cerises (pour certain.e.s<br>Courgettes / pâtissons / zapallito<br>Concombre (pour certain.e.s)<br>Haricots (pour certain.e.s)<br>Aubergines ou poivrons<br>Céleri branche<br>Un petit piment rouge<br>Courge spaghetti</div>
  </div>
  </section>
  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>On est content.e.s aujourd'hui car il fait plus frais ! On est temporairement sorti.e.s d'un déni collectif sur l'infestation de punaises dans les tunnels... mais bon comme c'est un des ravageurs où on peut rien faire du tout, ça change pas grand chose. Elles sont super jolies cependant !<br>D'ailleurs vous conseille de laver les tomates avant de les consommer, certaines ont malheureusement un petit goût particulier à cause d'elles</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div>On a toute une série de trucs en cours pour <strong>mieux faire connaître Rage de Vert</strong>, et trouver de nouveaux membres. Comme on l'avait dit le 5 août, on a des nouveaux flyers à disposition. N'hésitez pas nous en emprunter quelques-uns pour distribuer à vos amis.<br>On aura aussi sous peu des stickers autocollants. Vous pourrez en prendre pour les coller sur votre casque de vélo, sur votre sac à main, sur les cahiers scolaires de vos enfants, sur la poussette des petits derniers, ou le déambulateur des moins jeunes,....</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Courge spaghetti à la bolognaise<br><br>REMARQUE IMPORTANTE : La courge spaghetti n'a pas beaucoup de gout, mais elle a une texture formidable ! Une fois qu'elle est cuite, passez dedans avec une fourchette er elle s'effilochera ! Incroyable<br><br>Soit au four :<br>- Couper la courge en deux et enlever la partie avec les graines<br>- Faire une bonne sauce bolognaise (avec du céleri branche peut être?)<br>- Mettre la bolognaise dans la courge, éventuellement ajouter du fromage râpé et hop ! au four<br><br>Soit plus rapide et sans four :<br>- Couper la courge en deux et enlever la partie avec les graines<br>- Couper en gros morceaux et cuire à la vapeur<br>- Faire une bonne sauce bolognaise (avec du céleri branche peut être?)<br>- Une fois qu'elle est cuite, passez dedans avec une fourchette er elle s'effilochera ! Incroyable<br>- Servir les spaghettis de courge avec la sauce</div>
  </div>
  </section>
