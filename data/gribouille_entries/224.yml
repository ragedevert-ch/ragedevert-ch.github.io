  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div>Etes-vous prête.x pour 24 h de fun ? car ce week end c'est la raisinéeeeeee : <br><br><div class="attachment attachment--preview">

    <img alt="image.jpeg" src="/assets/images/gribouille/224/image-3.jpeg">
  </div><br><br>Le JDM et la Bor sont back avec 5000 tonnes de jus de pomme à réduire en RAISINéE all night long ! OOOOoooooOOOuuuHHHhhh !! On exagère peut-être un peu sur les quantités, mais on peut assure que le Chauderon débordera de FUN et de surprises rancobolesques. Enfilez vos plus beaux costumes et venez danser en rond de sorcières jusqu'au lendemain. <br>Rejoignez nous pour 24 heures DE TOUILLE, avec au programme : une line up DJ signée le collectif des Zines, un concert de zinzin de trash Mantra, une jam tonitruante, des pizzas au feu de bois, un jacuzzi (lui aussi au feu de bois), des jeux débiles, un sleeping tout cozy et pleins d'autres activités pour survivre à cette nuit de folie ! <br><br>Oû ? au pressoir de la Bor, 2042 Valangin (PAS AU JARDIN) <br>Quand ? vendredi 30.10 au samedi 31.10<br>Le JDM vous aime, venez nombreuses &lt;3<br><br><br><br>E<strong>t sinon cest bienôtt Noël aussiiiiii</strong><br>Pensez déjà à la <strong>Fête de Noël de Rage de Vert</strong> à l'occasion de la dernière livraison du <strong>16 décembre</strong>. Ce sera comme les années précédentes au Jardin de la Main dès 16h et jusque dans la soirée, avec des stands d'artisans amis de Rage de Vert, toutes sortes de choses à boire et à manger, et pleins de gens à rencontrer.<br>Pensez aussi qu'un <strong>Bon </strong>pour un petit bout d'abonnement Rage de Vert ferait un joli cadeau de Noël.</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Paniers subventionnés - Programme "Vivre et Agir Ensemble"</strong><br>On l'avait brièvement évoqué dans notre message du 1er octobre. Dans le cadre de son programme "<em>Vivre et Agir Ensemble</em>", le canton de NE a accepté une demande initiée par notre maraichère Marion dont le titre était <a href="https://www.ne.ch/sites/default/files/2026-05/2026_PVE_dossierpresse_appel4-v2_REC_0.pdf">"<em>Un accueil dans les champs pour une agriculture solidaire</em>"</a>. Le soutien du canton est limité dans le temps et dure un peu plus d'une année. Il consiste à subventionner l'inscription ou l'engagement à Rage de Vert de "<em>détenteurs de la carte Caritas et les personnes inscrites auprès des guichets sociaux</em>" contre une participation aux activités des champs. Les idées sont d'une part que faire partie d’un réseau d’agriculture solidaire ne devrait pas être une question d’argent. D'autre part, pour une partie des personnes ciblées, Rage devrait être un lieu d'accueil et d'accompagnement bienveillant pour des personnes vivant une précarité source d’isolement et de manque de reconnaissance sociale.<br>Pour les personnes qui sont déjà membres de Rage de Vert, il vous suffit de nous communiquer l'information avec les preuves requises (n° de carte Caritas,...) en vue de la réduction possible pour l'abonnement 2027.<br>Pour les nouveaux membres, les indications utiles sont visibles sur le bulletin d'inscription sur www.ragedevert.ch. Faites-le savoir autour de vous.<br>La subvention égale 40% du prix standard des paniers.</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Beignets de tomates vertes pour épater vos convives tellement c'est original et bon !<br><br>Couper les tomates vertes en tranches de env. 1cm ou un peu plus grand.<br>Si vous aimez que ça soit tendre, cuire très rapidement à la vapeur, sinon pas besoin. Egouter les tomates si cuites<br>Mélanger de la farine, du sel, du poivre et de la semoule ou pollenta fine dans une assiette<br>Mélanger de l'oeuf et du lait.<br>Tremper les tomates dans le mélange oeuf/lait, puis dans le mélange farine et compagnie.<br>Faire griller (frire c'est meilleur mais c'est plus gras, choisissez votre préférence)<br>Miam ! Si vous voulez à manger avec une petite sauce de votre confection<br><br>Aussi possible de faire les tomates vertes en confiture, fermentées dans de la saumure, ou en chutney, trop bien !<br><br>La trévise peut se cuisiner en risotto ou en salade :)<br><br></div>
  </div>
  </section>
