  <section id="intro"><div class="trix-content">
    <div>L'équipe maraichère a déjà exprimé ses "Hourra" et "Merci" dans la Gribouille du 21 octobre. Le "Tour d'engagement" destiné à sauver notre budget 2027 a rudement bien fonctionné grâce à vous. Un tout grand merci.<br>Vous avez dû recevoir un mail automatique vous remerciant personnellement pour ce que vous avez pu offrir dans ce Tour d'engagement.<br>Nous vous donnerons des nouvelles un peu plus détaillées et chiffrées prochainement ....<br>En vue de l'abonnement 2027, pensez à examiner ce qui est écrit plus bas en lien avec les "paniers subventionnés".</div>
