  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div><strong>Droit de réponse de la gribouille du 1er juillet 2026:</strong><br>J'exerce (Sam, le stagiaire) un droit de réponse suite aux propos diffamatoires qui ont été tenus à mon encontre lors de la dernière gribouille. En effet, je n'ai absolument pas écrasé de tomates a cause d'une manoeuvre tractorialle. Tomates, qu'on aurait soit disant ensuite transformé en ketchup pour vos paniers. Ce sont des sottises écrites par ma collègue et <em>cheffe </em>Katarina qui, et je la cite : "voulait faire une simple blague, nos membres sont simplement trop naïfs et y ont crus". Ne soyez pas déçu.e.s, avec des ongles comme ça elle était forcément diabolique..<br>Voilà, la vérité est désormais restaurée, la liberté d'expressions et la démocratie sauves, bravo tout le monde!<br><div class="attachment attachment--preview">

    <img alt="IMG_6735.jpg" src="/assets/images/gribouille/193/IMG_6735.jpg">
  </div><br>Bon sinon vous avez du le comprendre par les haïkus, on a un problème de pucerons et notre première série de concombres est mourrue. Mais rassurez-vous une deuxième est sur le chemin et ne saurait tarder à garnir vos paniers de ces délicieux cucurbitacés.<br>Cette semaine nous avons enfin terminé de planter les HUIT-MILLES-CINQ-CENTS poireaux en écoutant le doux bruit de l'autoroute et l'album génial d'Amara Touré : 1973-1980. Et oui, Rage de Vert c'est aussi des recommandations musicales supers.</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div>C'est Marion qui parle aux tomates (elle est parfois étrange)<br>Kata qui décide tout et martyrise le stagiaire (blague, mais faut bien que je me venge)<br>Marjan en vacance (quelle chance, mais il nous manque)<br>Sam à la gribouille (pendant que les autres siestent)</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Courgettes farcies !<br>Coupez vos énormes courgettes dans le sens de la longueure, retirez une partie du centre à l'aide de l'ustensile de cuisine de votre choix (ça marche mieux avec une cuillère si jamais).&nbsp;<br>Faites une farce à votre gout (par exemple: le reste de la courgettes, de l'ail (beaucoup), des oignons, du hachis végératien (ou du tofu, ou des champis), des carottes, ce que vous voulez en fait!)<br>Enfournez à 200 degrés pendant 30-40 minutes (faut surveiller)<br>Dégustez !</div>
  </div>
