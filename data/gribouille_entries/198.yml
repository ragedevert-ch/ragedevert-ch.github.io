  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Offre d'emploi bénévolat:<br><br>Rage de vert cherche <strong>chasseur.eu.x indépendant.e.x de campagnoles</strong>.<br>Avez-vous des connaissances avec l'outil "topcat" ou la volonté de vous former?<br>Parlez-vous au moins une langue entre campagnolien, souriquois ou taupinois?<br><br>Nous offrons:<br>Horaire flexible et a votre choix. (pas de télétravail possible)<br>Des cafés avec l'équipe sympa.<br>Enormement de remerciement.<br><br>Nous attendendons avec impatience votre dossier.<br><br>...c'est d'ailleurs a cause de ces bestioles qu'on vous donne des poivrons pas encore tout a fait mures, mais si vous les laissez entre quelques jours dans votre frigo, ca pourrait murir encore en peu, et sinon c'est aussi bon un peu vert :)</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Valeur des paniers</strong><br>Depuis le début de Rage de Vert, et même si on n'est pas seulement motivé par faire tourner une association pour produire nos propres légumes, mais aussi par des "valeurs humaines ou sociales", on s'est posé la question de la valeur monétaire de nos paniers de légumes. On se disait bien que la comparaison se ferait inévitablement avec d'autres possibilités de trouver de quoi manger. "<em>Cela me coûterait combien ces légumes si je les achetais à la Migros ou dans un magasin Bio ?</em>". On a depuis toujours comparé avec les <a href="https://www.marchepaysan.ch/liste-de-prix">prix des marchés paysans</a>. On est toujours arrivé à une valeur sur l'année clairement supérieure à ce qu'on facture. Voilà les chiffres pour 2025 qui montrent une bilan favorable pour chaque taille de panier.<figure class="attachment attachment--preview">
    <img width="1024" height="117" src="/assets/images/gribouille/198/D533F93D-0745-4468-A8D0-719DC8DB6C9E_.png">
  </figure><br>La valeur n'est bien sûr pas la même de semaine en semaine, et selon la saison. Les paniers d'été valent plus que ceux d'hiver. La différence favorable entre la valeur annuelle des paniers et ce que vous payez tient aussi au fait que tout ce qui sort des champs est réparti entre les membres existants au moment donné. Nous sommes environ 160 membres actuellement. Chaque année vers octobre-novembre, au moment de faire le plan de culture pour l'année suivante, on doit faire un pari sur le nombre de membres que nous aurons l'année suivante. Etant donné que l'on espérait chaque année crever le plafond des 200 membres, ceci pour assurer un bilan financier permettant de payer correctement 4 agriculteurs, on faisait un plan de culture ambitieux et les commandes de plantons qui vont avec. On cultivait donc pour plus que 200 membres et on en distribuait les récoltes correspondantes à 170-190 membres !! C'est une partie des raisons qui font la différence entre la valeur des paniers et ce que vous payez. Pour 2026, on a décidé d'arrêter d'avoir des ambitions que nous ne pouvons pas atteindre. Nous avons donc planifié une production maraîchère pour environ 170 membres, et il ne devrait donc pas y avoir à la fin de l'année, une différence aussi favorable entre la valeur des paniers et ce que vous payez ....</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Gratin de fenouil<br><br>Couper en pièces les fenouils et également leur fanes.<br>Les cuire un petit moment dans l'eau puis mettre dans une forme de gratin, saler, poivrer, couvrir de fromage (ou fromage végane) et graines de pin (ou tournesol pour le petit budget).<br>Cuire dans le four jusqu'a ce que c'est croustillant.<br>E Buonappetito!</div>
