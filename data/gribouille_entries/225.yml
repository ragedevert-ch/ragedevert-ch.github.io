  </div><p>Qui, de Kata ou Kara(koi) est le/la plus investi.e dans le plan de culture ?</p><div class="attachment attachment--preview">


    <a href="https://admin.ragedevert.ch/rails/active_storage/blobs/redirect/eyJfcmFpbHMiOnsiZGF0YSI6OTgzMSwicHVyIjoiYmxvYl9pZCJ9fQ==--1f9ada7ce1011a59e30416c68fb00aea7b301735/image.jpeg"><img alt="image.jpeg" src="/assets/images/gribouille/225/image-3.jpeg"></a>
  </div><p>Pendant les pauses on a beaucoup rigolé devant des vidéos de chat "funny cat, impossible not to laugh", et mangé des branches de chocolats. On vous prépare plein de beaux légumes surprises dans les paniers pour l'année prochaine !! </p><p><br></p>
  </div>
  </section>
  <section id="basket"><h2>Probablement dans votre panier</h2><div class="rich-text">
    <p>chou plume ou palme</p><p>courge</p><p>ail</p><p>scarole ou trevise</p><p>radis blanc (ou pas blanc)</p><p>persil (pour certaines)</p><p><br></p>
  </div>
  </section>
  <section id="echo"><h2>Écho des champs</h2><div class="rich-text">
    <p>Il commence à faire froid, mais on est là ! on continue les récoltes de garde, à planter de la doucette, désherber quand on a le temps... </p><p><br></p><p>N'hésitez pas à ramener des sacs si vous en avez plein chez vous :) </p>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="rich-text">
    <p><strong>Initiative des abeilles</strong></p><p>L'initiative « abeilles » veut inscrire dans la Constitution la préservation de la pollinisation des plantes cultivées et sauvages par les insectes. Des feuilles de signature seront insérées dans les paniers, et vous devriez en trouver au Jardin de la Main. On vous en met également en pièce jointe. Si vous êtes disposés à vous engager pour l'effort que représente la collecte et la défense de cette initiative, les informations sont disponibles <a href="https://www.initiative-abeilles.ch/engager">ici</a>, et il y a un <a href="https://chat.whatsapp.com/GN4dBotcY1lIwu3PCr6z3d?mode=gi_t">groupe </a>WhatsApp des bénévoles de l'arc jurassien.</p>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="rich-text">
    <p><strong>Tour d'engagement - Vous avez été magnifiques, voici combien !</strong><br>Par nos messages du 31 août et du 1 octobre, nous vous avions rendu attentifs aux défis de Rage de Vert pour 2027: le besoin d'avoir au moins 4 maraîcher.es professionnel.le.s à 50 % pour ne pas tomber d'épuisement, et le besoin d'avoir les entrées d'argent qui vont avec, soit par un nombre de membres suffisant, soit par le financement par les membres à la hauteur requise.<br>Nous avions donc mis en oeuvre le "<em>Tour d'engagement</em>" auquel vous avez participé avec générosité, qui devait permettre d'ajuster le prix de votre panier 2027 sur une base volontaire pour tenter de rassembler l'argent requis. On avait calculé qu'il nous fallait trouver 37'000 CHF pour pouvoir financer le/la 4ème maraîcher.e pour toute l'année. <strong>Vous avez réussi à offrir plus de 30'000 CHF !!!</strong> Cela permettra d'avoir un.e 4ème maraîcher.e pour 10 mois. L'essentiel est sauf. L'équipe peut travailler avec enthousiasme pour préparer la saison 2027. Et on est en train de sélectionner le/la 4ème maraîcher.e qui viendra compléter l'équipe.<br>Merci !</p>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="rich-text">
    <p>Risotto de Trévise au vin</p><p>Éplucher et hacher un oignon, puis le faire suer à l'huile d'olive. Une fois qu'il est doré, ajouter du riz à risotto et le nacrer à feu doux. Verser 15 cl de vin rouge et laisser le riz l'absorber, puis verser une louche de bouillon (le liquide doit arriver à hauteur du riz). Laisser cuire doucement en rajoutant une louche de bouillon de temps en temps lorsque le riz l'a absorbé.&nbsp;<br><br>Nettoyer la trévise puis l'émincer finement. Poêler rapidement avec de l'huile d'olive et l'ajouter au risotto. Déglacer la poêle de cuisson avec un trait de vin rouge, puis verser le liquide obtenu dans le riz.&nbsp;<br>Retirer le risotto du feu, ajouter du beurre et du parmesan. Miam !</p><p><br></p><p>bisous </p>
  </div>
  </section>
