  <section id="intro"><div class="trix-content">
    <div>Mais qui a le temps de composer un poème?<br>Qui plus est en alexandrins, tenez-vous bien!<br>C'est le Stagiaire! Il aurait pas mieux à faire?<br>Ramasser des légumes? Désherber quelque brins?<br><br>Et en même temps, il a une bonne raison..<br>C'est afin de vous souhaiter, très chèrexs membrexs,<br>Plein de cuisine et une magnifique saison!<br><br><div class="attachment attachment--preview">

