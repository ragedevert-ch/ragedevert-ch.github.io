  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>Des pois mange-tout<br>Des fleurs d'ail<br>Des carottes bottes qui trotinnent<br>Des céleris<br>De la super salade<br>Du persil ou du basilic pourpre<br>Enfin, pour certainexs chanceuxses des brocolis (pas super beaux, mais, selon les limaces, supers bons!<br><br></div>
  </div>
  </section>
  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Il fait chaud ou bien il fait froid? On y comprends plus rien!<br>En tout cas les légumes se portent à merveilles et les premières tomates pointent le bout de leur nez! On s'en occupe avec beaucoup d'amour (Marion leur fait même des bisous) et nos doigts sont tout verts!<br>Les mais et les carottes de gardes aussi commencent leur apparition, qui vient nous aider à les désherber?<br>Ah oui, aussi! On a réussi le contrôle bio :)) Et ce, malgré le fait que notre stagiaire a traité tous les champs au glyphosate une semaine avant.. un vrai miracle..<br>Plus sérieusement, c'était le premier contrôle de notre nouvelle équipe maraichère et une préparation minutieuse (mais assez éreintante, laisser nous travailler dehors enfaite) nous a permis de le passer avec BrIO (brio, bio.. vous l'avez?)<br><br><br><br></div>
  </div>
