  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Renouvellement de votre abonnement pour 2027</strong><br>Jeudi prochain, vous aller recevoir le dernier message rappelant que c'est la saison des renouvellements de votre abonnement à Rage de Vert. <strong>Si vous ne faites rien</strong>, votre abonnement se poursuivra automatiquement en 2027 aux mêmes conditions qu'en 2026. <strong>Si vous ne souhaitez pas poursuivre en 2027</strong>, il faut faire quelque chose: cliquer sur "Non-renouvellement" dans votre page de membre, ou nous faire une communication par email (info@ragedevert.ch) ou par téléphone (076 481 13 84). Et si vous ne poursuivez pas en 2027, expliquez brièvement et sans pitié vos motifs. Cela nous aide à comprendre ce qui peut pécher à Rage de Vert.<br><br><strong>Enfin une photo d'équipe :&nbsp;<br></strong><div class="attachment attachment--preview">

