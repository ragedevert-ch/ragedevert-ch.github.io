    <div><strong>Un sticker bien placé = un double panier à gagner</strong></div><div>Vous savez qu'on fait plein d'efforts pour trouver de nouveaux membres de Rage de Vert. Dans la Gribouille du 2 septembre, on avait lancé un concours d'usage original des autocollants Rage de Vert qu'on avait glissés dans les paniers de la même semaine. Pensez à envoyer vos chefs-d'oeuvre d'idées pétillantes avant le 27 septembre à info@ragedevert.ch (voir les détails du concours dans la Gribouille du 2 septembre).</div>
