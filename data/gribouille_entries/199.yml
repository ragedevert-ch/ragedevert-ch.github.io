sections_html: |-
  <section id="intro"><div class="trix-content">
    <div>Cette semaine au jardin de la main, l'association du jardin et votre Sacha préféré vous proposera des délicieuses prunes à acheter si vous voulez faire un clafoutis (ou toute autre miamerie), trop la chance !<br>On en profite pour vous rappeler que l'association vend aussi des sirops de romarin au Jardin de la Main que vous pouvez acheter lors des marchés-paniers(re-trop la chance)<div class="attachment attachment--preview">

    <img alt="20260804_072904.jpg" src="/assets/images/gribouille/199/20260804_072904.jpg">
  </div></div>
  </div>
  </section>
  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>Tomates (beaucoup de tomates fendues, on vous les propose quand même afin de ne pas les composter :)<br>Tomates cerises<br>Courgettes (et aussi un peu de pâtisson, zapallito, courgettes rondes)<br>Aubergines (pour certain.e.s)<br>Concombres (pour certain.x.s)<br>Poivrons (pour certain.x.s). Pas forcément colorés car sinon les campagnols les mangent avant qu'on les trouve<br>Petites salades<br>Haricots(pour certain.x.s)</div>
  </div>
  </section>
  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Aïe Aïe Aïe, on est en retard désherbage... Mais heureusement nos vaillant.e.s abonné.e.s sont sur le point de venir nous aider à désherber aux champs grâce aux nouvelles places de demi-journées ouvertes, quelle chance !<br>Petit quizz : quel est ce légume enseveli sous le galinsoga ?<br><div class="attachment attachment--preview">

    <img alt="20260804_093350.jpg" src="/assets/images/gribouille/199/20260804_093350.jpg">
  </div></div>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div>Courges spaghetti (pas tout de suite)... Oups, accident de brouette<br><div class="attachment attachment--preview">

    <img alt="20260803_142140.jpg" src="/assets/images/gribouille/199/20260803_142140.jpg">
  </div>..</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div>On a toute une série de trucs en cours pour faire mieux connaître Rage de Vert, et trouver de nouveaux membres. Un premier truc tout simple est déjà disponible: un nouveau stock de flyers. N'hésitez pas nous en emprunter quelques-uns pour distribuer à vos amis. Il y en aura mercredi au Jardin de la Main. On vous les met aussi en pièce jointe.</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Courgettes / pâtisson / Zapallito farci<br><br></div><ul><li>Coupez le haut de la courgette et vider l'intérieur à la cuillère.</li><li>Mélanger l'intérieur avec des oignons, de l'ail, les épices que vous aimez et des tomates (et un peu de riz cuit si vous voulez). Faites revenir à la poêle jusqu'à ce que ça sente bon</li><li>Déposer la farce dans la "coquille" de courgette et mettre au four (ajoutez avant cuisson de la fêta pour les gourmand.e.s)</li></ul><div>Bon app' !</div>
  </div>
  </section>
