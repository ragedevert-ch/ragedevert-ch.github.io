  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Départ de Katharina</strong> <br>On est tout triste d'annoncer le départ de Katharina à la fin de l'année. Mais c'est pour la bonne cause !! Katharina a un fort ancrage dans la région biennoise, où elle est active dans toutes sortes de trucs très biens. Elle est notamment impliquée dans un projet agricole à Grossaffoltern, qui devient très concret. C'est l'achat d'une ferme de 5 ha, en connexion avec l'épanouissement d'une sorte de Rage de Vert bernois qui s'appelle <a href="https://solamix.ch/fr/">Solamix</a>. On lui souhaite une belle suite pour ses aventures durables et joyeuses. <br><div class="attachment attachment--preview">

    <img alt="Katharina.jpg" src="/assets/images/gribouille/214/Katharina.jpg">
  </div><br><br><strong>Renouvellement des abonnements pour 2027</strong><br>Comme chaque année à cette saison, c'est l'occasion de penser au renouvellement des abonnements pour 2027, renouvellement qui se fait tacitement sous réserve d'un non renouvellement de votre part. Vous recevrez sous peu un message spécifique à ce propos.<br>On compte sur vous pour l'année prochaine.</div>
