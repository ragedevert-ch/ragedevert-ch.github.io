  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Grace à nos super abonnéxs qui sont venues ces derniers jours on a accompli une incroyable tâche : le sauvetage des choux ! 12 planches de 30m de long désherbées à la main. Bravo à toutes les personnes qui ont participé et merci infiniment !<br><br>Cette semaine c'est désherbage des poireaux, broyage de prairie, réparation de machines, tuteurage de tomates, récolte de l'ail et excavation de tuyeaux d'irrigation enherbés !<br><br>N'hésitez pas à venir nous aidez aux champs, vous nous manquez :)<br><div class="attachment attachment--preview">

    <img alt="20260715_101013.jpg" src="/assets/images/gribouille/197/20260715_101013.jpg">
  </div></div>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div>Cyclone fête ses 5 ans ! On vous transmet leur message :<br><br><strong>Bonjour chères amies, chers amis et précieux soutiens de la cyclomessagerie,</strong>&nbsp;<br><br></div><div>Voilà déjà cinq ans que la coopérative Cyclone a vu le jour.&nbsp;<br><br></div><div>Elle n'est pas sortie de terre comme le germe d'une graine fraîchement semée, mais s'est greffée sur la solide souche de vélocité Neuchâtel.&nbsp;</div><div>La greffe a pris, et le greffon a porté ses fruits. Depuis cinq ans, nous avons le plaisir, et parfois l'ivresse, d'élaborer un service de livraison qui ressemble à notre terroir, un projet dans lequel nous nous sommes pleinement investi.e.s.</div><div>Ce ne fut pas toujours facile : le terroir neuchâtelois est riche, exigeant et singulier.</div><div><br></div><div>Cette introduction, qui sent davantage le vin que l'aisselle de cycliste, n'avait qu'un seul but : vous inviter à lever un verre avec nous et à partager nos expériences de coursières et coursiers, de coopérative, et bien plus encore.</div><div><br></div><div>Nous vous donnons rendez-vous le <strong>samedi 22 août dès 11 h, au Black Office,</strong> <strong>Rue de l'Église</strong>. Nous aurons le plaisir de vous accueillir autour d'un brunch et de vous présenter, dans nos locaux fraîchement rénovés, une rétrospective de ces cinq belles années d'activité.&nbsp;<br><br></div><div><strong>À partir de 14h</strong>, à condition d'une météo favorable, nous vous proposerons un léger déplacement jusqu'à la plage de <strong>Serrières,</strong> afinde piquer une tête bien méritée.&nbsp;</div><div>Et pour terminer cette journée comme il se doit, le temps attendu apéro, se fera <strong>aux alentours de 17h au Barraquito au port de Serrières</strong>.&nbsp;<br><br></div><div>Merci de nous confirmer le nombre de personnes participant à l'événement, par retour de mail (comm@lacyclone.ch)</div><div><br></div><div>Nous nous réjouissons de partager ce moment avec vous et de célébrer ensemble ces cinq premières années d'aventure.&nbsp;</div><div>Avec nos chaleureuses salutations&nbsp;<br>Cyclone</div><div><br></div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div>C'est Kata en vacances (tu nous manques, est-ce que tu lis nos gribouilles ?), Sam qui sifflote, Marion qui prend la pompe du deuxième terrain par les cornes et Marjan qui range les oignons.<br><div class="attachment attachment--preview">

