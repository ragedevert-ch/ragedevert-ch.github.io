  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="rich-text">
    <p>C'est Sam qui est à l'école <s>de la vie </s>du maraîchage. Marion qui récolte des Choux de Bruxelles sous la pluie. Kata qui fait des choses intéressantes (comme s'entrainer au karaoké, mettre les sacs pour la livraison de mercredi et qui brille de mille feu). Marjan qui est mouillé</p>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="rich-text">
    <p>CHOUX DE BRUXELLE GRILLéS AU MISO MIAM</p><p>il faut laver et couper les choux de BX en 2 ou 4, et les mettre dans un plat qui va au four.</p><p><br></p><p>Faire une petite sauce avec du miso (env une grosse C.S), de l'huile de tournesol, du sirop d'érable (ou miel ou sirop d'agave, bref un truc sucré un peu)</p><p><br></p><p>mélanger ces choux de BX dans la sauce et les faire griller environ 30 minutes au four à 180°C</p><p><br></p><p>un délice que même mes cousin.e.s adorent !! (alors que c'est des ENFANTS qui disaient ne ps aimer les choux de BX avant)</p>
  </div>
