  <section id="basket"><h2>Probablement dans votre panier</h2><div class="rich-text">
    <p>doucette</p><p>choux de Bruxelles (pas très très jolis, mais ils sont là, à nettoyer un peu)</p><p>céleris (pour certaines ou pour tout le monde)</p><p>pain de sucre (pour certaines ou pour tout le monde)</p><p>choux chinois pour certain.es</p><p>peut etre de la menthe si vous avez de la chance et si on a le temps</p><p>courges (qui sont très bonnes mais font aussi une très jolie déco chez la grand-mère de Marjan, probablement ce serait joli aussi chez vous )</p><div class="attachment attachment--preview">


