  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Demain on dit au revoir aux tomates, c'est pourquoi vous aurez peut-être des pas très mûres... mais laissez les mûrir si besoin quelques temps avant de déguster vos dernières tomates de l'année ! Astuce : si vous les mettez près de pommes ou de bananes elles vont mûrir plus vite. trop nice!<br><br>Sinon on a récolté tous les céleris, les voilà bien à l'abri des campagnols dans la chambre froide ! <br><div class="attachment attachment--preview">

    <img alt="image.jpeg" src="/assets/images/gribouille/223/image-2.jpeg">
  </div><br>Il nous reste cependant encore un légume de garde à récolter. Le pire, puisqu'il pousse assez profond en terre et qu'il faut batailler pour le sortir. Le plus méchant puisque si tu le touches, et que tu vas au soleil après, tu auras des cloques trop stylées.Le plus jeune, puisqu'il n'est même pas encore né. Et votre préféré, j'ai nommé les panaiiiiiiis ! N'hésitez pas à venir nous aider, ça va être trop fun!</div>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div><strong>Inauguration de la maison du vélo : </strong><br>Chers amis,</div><div><br></div><div>Etant arrivés au bout des travaux de rénovation du "garage", il est temps pour nous d'inaugurer la Maison du vélo!</div><div><br></div><div>Après une année de travaux et d'aménagements: de nouveaux espaces, un nouvel atelier d’autoréparation et des locaux repensés pour les cinq entités habitant la première Maison du Vélo du canton ! Nous avons le plaisir de vous inviter à l’inauguration officielle de la Maison du Vélo:<br><br><strong>Samedi 7 novembre 2026</strong> <strong>de 10h à 13h</strong><br>Venez partager un chaleureux brunch apéritif dès 10h, découvrir les lieux lors de visites flash et assister à la partie officielle à 11h. Nous aurons l'honneur d'entendre: <br><strong>Mme Delphine Klopfenstein Broggini, </strong>Présidente de Pro Vélo suisse<br><strong>M. Patrick Rérat, </strong>Co-directeur de l'Observatoire universitaire du vélo et des mobilités actives (OUVEMA) de l'Université de Lausanne<br><br>Ce sera aussi l’occasion de vous faire visiter les nouveaux locaux et de partager des activités vélos. Merci simplement à vous d’annoncer votre venue&nbsp; pour nous aider à préparer au mieux cette belle journée sur ce lien : <a href="https://leblackoffice.statslive.info/c/6146232401/eyJpdiI6InYrYzhkYmw3SnJ2a25lK1RsajZnM1lZd2l2UE1oM3MzSWtWVU1HcjhIZ3c9IiwibWFjIjoiMDg2MWI0MWQwMzAzMmNiMmI1OWVmZGU4NDM3NjdhMzFkZGM3ODc0ODdkYjNhNWM5YzAwZTA1ZjhhOThiNTA1OCIsInZhbHVlIjoibkpQNnl3cmkxdlFxTW9UNzlmckhzWEdPYTU5NXJrM2pyUkxxMUpwOEZXdz0ifQ==">Inscription inauguration</a></div><div><br><strong>Festival vivre et agir ensemble </strong><div class="attachment attachment--preview">

