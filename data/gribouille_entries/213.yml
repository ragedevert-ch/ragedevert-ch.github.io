sections_html: |-
  <section id="intro"><div class="trix-content">
    <div>Idée déconseillée : faire une fondue entre collègues à midi. En pleine digestion, la reprise du dur labeur est difficile et mes yeux se fermmeowjfpiuefbioadkdnajnaowdnc. oh pardon je me suis assoupi sur le clavier.. Je me concentre, il faut bien écrire cette gribouille! Plus sérieusement on vient de fêter l'anniversaire de notre chère voisine Rosely (big up à elle) et celui de notre chère collègue Marion (big up à elle aussi) autours d'une super fondue. C'était un beau moment de convivialité donc je retire ce que j'ai dit plus tôt : Idée super que de faire une fondue entre collègues à midi!<br>On vous partage cette info utile afin que vous puissiez souhaiter à Marion et à Rosely un joyeux anniversaire (en retard) la prochaine fois que vous les voyez. Vous pouvez même faire un cadeau à Marion (elle adore le beurre salée! oui, elle est pas difficile).</div>
  </div>
  </section>
  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>Tomates<br>Tomates cerises (c'est comme des tomates mais de la taille de cerises)<br>Colrave<br>Mais<br>Courgettes (si vous avez des pâtissons, la peau se mange aussi!)<br>Aubergines<br>Poivrons<br>Concombres<br>Un fruit très végétarien</div>
  </div>
  </section>
  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>En fait il suffisait qu'on installe le pluviomètre pour que la pluie revienne dans la région. Donc vous pouvez nous remercier d'avoir sauver notre écosystème à l'agonie à cause de la sécheresse et on s'excuse d'avoir mis autant de temps avant de l'installer (ci-joint 57mm de pluie)<br><br><div class="attachment attachment--preview">

    <img alt="IMG_7449.jpg" src="/assets/images/gribouille/213/IMG_7449.jpg">
  </div><br><br>Et on a également récolté notre maïs qui était magnifique (là sur la photo vous le voyez broyer donc vous pouvez pas trop voir à quel point il était magnifique) mais vous pouvez demander au trio champignons, punaises, souris, qui elleux se sont régalées)<div class="attachment attachment--preview">

    <img alt="20260824_140137.jpg" src="/assets/images/gribouille/213/20260824_140137.jpg">
  </div><br><br></div>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div><strong>L'AQSB en fête</strong><br>L'association de quartier de Serrières et environ est l'une des plus dynamiques de l'agglomération de Neuchâtel, et Rage de Vert avait historiquement des contacts privilégiés avec cette association. Elle a sa fête annuelle au riche programme (voir la pièce jointe) les 28-30 août. Si un membre de Rage de Vert a l'intention de s'y rendre, profiter de l'occasion pour y faire la promo de nos paniers de légumes (des flyers, stickers, bâches sont disponibles ; contacter le 076 418 13 84 ou info@ragedevert.ch)</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Humour de légumes - C'est la rentrée scolaire, alors on vous raconte une blague des petits</strong><br>C'est l'histoire d'un citron, et d'une carotte qui décident de braquer une banque. Le citron a le trac mais il essaie de ne pas rire jaune. La carotte transpire beaucoup dans son slip orange. Ils entrent dans la zone des guichets avec un vieux collant sur la tête. Le banquier crie au secours. Le citron sort son arme et hurle : « Pas un zeste, on est pressé ! » En attendant les sirènes de police, la carotte s'écrie : « Zut, les carottes sont cuites ! »<br><br><strong>Beaucoup de maraichers sont à la peine</strong><br>La production de fruits et légumes est sous pression à travers toute l'Europe. Les organisations de producteurs suisses indiquent une baisse de production importante, avec des coûts de production qui ont augmenté (voir ce <a href="https://www.rts.ch/info/suisse/2026/article/secheresse-en-suisse-hausse-des-prix-des-fruits-et-legumes-29334262.html">reportage RTS</a>). A Rage de Vert, on ne s'en sort pas trop mal. Mais il y a énormément de travail d'arrosage. Et sous la pression des divers ravageurs, certaines productions sont clairement moins généreuse que l'an passé.</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Steak de Pas-Steak (vous avez capté la blague du panier?)<br>Couper des tranches de 3-4 cm d'épaisseur et les faire mariner dans une marinade de votre choix (par exemple : huile d'olive, sauce soja, moutarde, concentré de tomate, sel, poivre)<br>Cuire à la poêle jusqu'à ce que ça grille un peu, bon app!<br><br>(si vous avez la flemme on a vu que la fondue c'est une super idée aussi, juste on la fait pas encore pousser dans nos champs)</div>
  </div>
  </section>
