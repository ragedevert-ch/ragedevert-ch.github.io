  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div><strong>Cima di Rappa <br></strong>Ce légume est un navet dont on mange la tige/feuilles/boutonsfloraux.&nbsp;<br><br>la recette de Marjan : faites cuire les cima à la vapeur, faire revenir des oignons et une folle quantité d'ail avec une folle quantité de beurre. Rajouter les cimas et poêler. Sortez du feu et rajoutez de l'huile d'olive et du jus de citron. C'est trop bon, c'est très gras mais c'est délicieux ;)&nbsp;</div>
