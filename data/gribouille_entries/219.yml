  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Vous avez remarqué que les paniers de cet été n'étaient pas toujours aussi affriolants que ceux d'autres étés. On en a déjà un tout petit peu parlé dans d'autres Gribouilles, mais on ne voulait pas trop avoir l'impression de se plaindre.<br>Il faut néanmoins dire que cette année a été terrible. Certes on est proche de la Thielle et on peut arroser. Mais la sécheresse a chamboulé les écosystèmes. On a déjà parlé des ravageurs et des maladies fongiques qui se sont imposés à nous dans une configuration vraiment inhabituelle. Vous avez remarqué les faiblesses en poivrons, concombres, haricots,... <br>Toutefois une bonne nouvelle, alors que les autres maraichers se plaignent de leur production de choux, la nôtre est pas mal du tout, vous en profiterez bientôt ;).<br>Et une petit photo des radis noirs que Sam a récolté avec passion.<div class="attachment attachment--preview">

    <img alt="20260928_110310.jpg" src="/assets/images/gribouille/219/20260928_110310.jpg">
  </div></div>
  </div>
  </section>
