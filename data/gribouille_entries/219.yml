  <section id="intro"><div class="trix-content">
    <div><strong>Décalage entre nos ressources et nos besoins</strong><br>Un peu comme les cantons qui tentent de boucler leurs budget, Rage de Vert doit trouver des solutions pour son budget 2027 entre les besoins incompressibles de l'équipe maraîchère pour ne pas tomber raide épuisée en cours d'année, et l'argent disponible avec le nombre de membres qui nous avons. Vous allez recevoir bientôt des informations précises sur une sorte de plan de sauvetage pour l'année 2027, destiné à trouver une solution intermédiaire, le temps que nos efforts marketing déploient tous leurs effets.</div>
  </div>
  </section>
  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>Chou chinois<br>Cima di Rappa<br>Chou pomme pour certaines<br>Carottes<br>Tomates pour certaines<br>Ail<br>Basilic<br>Parmesan<br>Concombre pour certaines<br><br>Conseil de conservation : Les légumes avec feuilles tiennent plus longtemps si vous les stocké dans un sac plastique au frigo!</div>
