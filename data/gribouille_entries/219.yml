  </div><br>On a encore des flyers, des stickers, et notamment des bâches, à disposition pour que tout le canton voit Rage de Vert à tous les carrefours ...Vous pouvez les demander aux maraîcher.ère.s au Jardin de la Main, ou nous en demander par mail ou téléphone.<br><br>PS : pensez à ramener vos sac et Marion n'a pas reçu de maquillage de récup</div>
