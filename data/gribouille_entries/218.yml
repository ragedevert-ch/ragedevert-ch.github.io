  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>tomate ou tomates cerises (pour celleux qui récupèrent leurs paniers au jardin de la main)&nbsp;<br>poivrons ou concombres ou aubergine (pour les paniers préparés à l'avance)&nbsp;<br>choux pommes (pour les moyens et les grands)&nbsp;<br>piments (pour les petits)&nbsp;<br>choux&nbsp;<br>courges&nbsp;<br>salades ou scarole&nbsp;<br>verveine ou coriandre &nbsp;</div>
