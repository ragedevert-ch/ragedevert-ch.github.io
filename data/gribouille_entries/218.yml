  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Comme vous le savez, on est à fond dans la pub; cola Instagram, nouveaux tickets, bâche à afficher partout, ... La grande nouveauté : on a lancé un partenariat avec la star du football français, j'ai nommé Kylian Mbappé: <br><div class="attachment attachment--preview">

    <img alt="IMG_8107.jpeg" src="/assets/images/gribouille/218/IMG_8107.jpeg">
  </div><br>On est pas sur.es de l'impact de ce partenariat mais bon, il était là au greendating et il a proposé donc bon, pourquoi pas essayer. Reste à voir s'il ramènera des abonné.e.s à la maison....<br><br><br>Si t'as le seum d'avoir raté le greendating (et Mbappé), en voici un petit aperçu à la télé ! Reste à voir si l'amour est dans le pré ... :&nbsp; <a href="https://canalalpha.ch/play/le-journal/topic/43234/et-si-lamour-poussait-dans-les-champs">https://canalalpha.ch/play/le-journal/topic/43234/et-si-lamour-poussait-dans-les-champs</a>&nbsp;<br><br><strong>Appel d'urgence :&nbsp;</strong><br>ramenez-nous des sacs ! c'est la dèche, on a besoin de vous ! vous pouvez laisser les sacs plastiques dedans, on les réutilises volontiers, et des petits chocolats, on les mange volontiers :) <br><br><strong>Autre appel à don : </strong>Marion aimerait apprendre à se maquiller mais n'a rien. La pauvre. Et ça coute cher le maquillage, et ça paie pas très bien le maraichage. Si vous avez du maquillage, crèmes, ou des ustensils (genre pinceau, porte perruques, etc) qui trainent et que vous n'utilisez plus à lui donner elle serait ravie.&nbsp;<br><br></div>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div><strong>Café scientifique - Cultiver la terre sans goût amer </strong><br>L'UNINE organise chaque année plusieurs "cafés scientifiques" sur des thèmes divers d'intérêt public. Ce mercredi 23 septembre à 18h, dans le Bâtiment principal de l'Université, Avenue du 1er-Mars 26, Neuchâtel (salle C46, 1er étage), le thème sera "<a href="https://www.unine.ch/evenement/cafe-scientifique-cultiver-la-terre-sans-gout-amer">Cultiver la terre sans goût amer</a>". Parmi les personnalités scientifiques amenées à tenter d'amener quelques lumières sur le thème discuté, il y aura Saskia Bindschedler, membre de Rage de Vert, et professeure au laboratoire de microbiologie de l'UNINE.<br>Le café scientifique suivant, celui du 21 octobre, abordera "La grande invasion des insectes exotiques".</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Renouvellement de votre abonnement pour 2027</strong><br>Idéalement, faites-le avant le 24 septembre pour que nous ayons les chiffres utiles pour notre séance de comité du même jour pour laquelle les prévisions pour 2027 seront précieuses. Dernier délai officiel: 30 septembre. <strong>Si vous ne faites rien</strong>, votre abonnement se poursuivra automatiquement en 2027 aux mêmes conditions qu'en 2026. <strong>Si vous ne souhaitez pas poursuivre en 2027</strong>, il faut faire quelque chose avant le 30 septembre: cliquer sur "Non-renouvellement" dans votre page de membre, ou nous faire une communication par email (info@ragedevert.ch) ou par téléphone (076 481 13 84). Et si vous ne poursuivez pas en 2027, expliquez brièvement et sans pitié vos motifs. Cela nous aide à comprendre ce qui peut pécher à Rage de Vert.</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div><strong>crumble à la courge, cardamome et poivre rose :&nbsp;<br></strong><br>Coupez la courge en petit morceaux, ajoutez un peu d'oignons et échalotte, et ail si envie.&nbsp; Saupoudrez de poivre rose et cardamome. Faites déjà un peu cuire au four.&nbsp;<br><br>Pendant ce temps, préparer la pâte à crumble : 100g de farine pour 100g de beurre pour 100g de parmesan (si ça vous fait plaisir)&nbsp; . La quantité est à adapter selon la taille de votre plat.&nbsp;<br><br>Mettez la pâte à crumble sur les courges et refaites cuire.&nbsp;<br>dégustez en bonne compagnie !&nbsp;</div>
  </div>
