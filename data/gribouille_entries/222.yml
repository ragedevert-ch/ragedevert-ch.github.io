  <section id="intro"><div class="trix-content">
    <div><strong>VOUS ÊTES VRAIMENT SUPER<br></strong>Un petit message de notre part, pour vous remercier. Plus de détails arriveront bientôt, mais sachez que grace à ce 1er tour d'engagement nous avons réussi à réunir suffisament d'argent pour que nous, l'équipe maraichère, abordions l'année prochaine sereinement! Youhouuuu Rage de Vert est sauvé :)))))))))<br>Pour vous remercier, voilà un petit texte :<br><br>TATATATATATATATatsoïïïïï<br>Voilà un poème de votre préféré bad-boy<br>J'ai nommé, le meilleur des chats, mon petit Karakoï<br>je lui laisse le clavier, c'est lui qui va vous remercier<br>Let's go petit monstre, envoies leur de la pâtée :<br><br>awdiondndndnaokjnjèpforkjèouh3ï279h9uj 0r8z'78p3IURNMéLEkwkfà nojJNJNPeifhpIWEUHèFIJOlskkqqpwidjbahdnIAOMIAdjowuhdd¨<br><br><br>C'est hyper impressionnant, <br>C'est même de l'avant-garde littéraire, comme Tolstoï en son temps<br>J'espère que ça vous a plu<br>Et n'oubliez pas, vous êtes d'un cool absolu (comme mon chat rappeur)<br><div class="attachment attachment--preview">

