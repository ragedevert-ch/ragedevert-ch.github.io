  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Avec le froid qui pointe le bout de son nez, nous arrivons au bout de la saison yippppeeeee! Quelque gros chantiers restent encore en vue, notamment de récolte. Mais le plus gros du travail est derrière nous!<br>On en profite du coup pour remercier grandement toutes les personnes qui sont venus nous aider aux champs mais aussi pour vous dire que <strong>êtes encore grandement les bienvenu.e.s</strong> <strong>à tout moment pour ces derniers chantiers!</strong> Pour vous donner envie : un de ces chantiers c'est de finir de planter l'ail (et l'ail c'est vraiment la vie)</div>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div><strong>Pommes</strong><br>A l'automne 2025, on avait organisé la possibilité d'avoir un abonnement pommes en complément du panier de légumes sur 15 livraisons entre octobre 2025 et avril 2026. Cette année, avec la sécheresse, la production de pommes est modeste (sauf pour la variété rubinette qui a assez bien donné). En outre l'équipe des jardiniers n'a pas voulu se rajouter la logistique des pommes à son automne 2026 très chargé. Du coup:<br>1) vous avez la possibilité d'obtenir des pommes dès le 17 octobre en <a href="https://ferme-montmirail.ch/">vente directe</a> auprès de Martin Ott, notre voisin agriculteur producteur des pommes au domaine du Grand Montmirail. Il suffit de l'appeler au 079 692 15 18 pour prendre rendez-vous.<br>2) on vous tiendra au courant en décembre quant à savoir s'il y a assez de pommes chez Martin pour organiser un abonnement comme l'an passé sur janvier - mars (ou avril) 2027.</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Concours d'autocollants</strong><br>Au début septembre, on vous avait distribué des autocollants pour faire connaître Rage de Vert de façon pétillante et originale. Dans la Gribouille du 2 septembre, on avait même lancé un concours intitulé "<em>Un sticker bien placé = un double panier à gagner</em>".&nbsp;<br>Même si on a reçu d'autres participations pétillantes (un autocollant Rage de Vert au milieu d'une soirée techno, sur un vélo, etc.), c'est Nelly Vielle qui a reçu le prix avec son sac à main qui présentera Rage de Vert chaque fois qu'elle sortira son porte-monnaie, son mouchoir ou son rouge à lèvres ... (on ne connait pas le contenu de son sac !!!!!)&nbsp;<br><br></div><div class="attachment-gallery attachment-gallery--2">
    <div class="attachment attachment--preview">

    <img alt="Sticker 1-1-1-1.jpg" src="/assets/images/gribouille/222/Sticker_1-1-1-1.jpg">
  </div><div class="attachment attachment--preview">

    <img alt="Sticker 2-2-2-2.jpg" src="/assets/images/gribouille/222/Sticker_2-2-2-2.jpg">
  </div>
  </div><div><br></div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Wok de chou chinois et gros radis<br><br>Commencez par la cuisson du radis qui prend plus de temps! Coupez à votre guise et faites sauter dans une poêle<br>Puis rajouter la partie blanche du chou chinois avec de l'ail haché et du gingembre râpé (petit tips, mettez le gingembre au congélateur, ça aide énormément pour le raper!)<br>Ajouter ensuite la partie feuille du chou chinois, laisser cuire un ptit peu (mais pas trop long!) et ensuite déglacez avec de la sauce soja et un peu de miel pour la caramélisation<br>Je vous connais, vous êtes des personnes de goût, donc arrosez huile de sésame et saupoudrez de graines de sésames aussi pendant qu'on y est!<br>à servir avec du riz ou des nouilles sautées<br>Bon app !<br><br></div>
  </div>
  </section>
