  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div><br><strong>"Greendating"</strong><br><br>Est-ce la jeunesse de notre équipe d’agricultrices et d’agriculteurs, les chaleurs de cet été ? Toujours est-il qu’à Rage de Vert (www.ragedevert.ch), on est parti dans un projet un peu fou de «Greendating», bref un événement de rencontre/recherche de partenaire dans les champs.<br><br>On a fignolé nos slogans :<br><em>Tu veux manger sainement et trouver l’amour ? <br>Tu veux soutenir l’agriculture locale et trouver un.e partenaire de grimpe, de roller derby ou simplement de nouveaux ami.e.s ?<br>Tu rêves de bisous sous les maïs ? De danser un slow dans les serres ?<br>Tu cherches quelqu’un sans te prendre le choux ?<br>Un partenaire à trouver qui ne te raconte pas que des salades !<br>Rage de vert te propose un #greendating</em><br><br>On a préparé quelques photos d’accroche :<br><div class="attachment attachment--preview">

    <img alt="1-1.png" src="/assets/images/gribouille/200/1-1.png">
  </div><br><br><div class="attachment attachment--preview">

    <img alt="2-1.png" src="/assets/images/gribouille/200/2-1.png">
  </div><br><br><div class="attachment attachment--preview">

    <img alt="3-1.png" src="/assets/images/gribouille/200/3-1.png">
  </div><br><br>Et on a commencé à en faire la promotion sur nos réseaux.<br><br><strong>Ce sera quand ? </strong>Le 12 septembre de 14h à 16 heures. <br><br><strong>Ce sera où ?</strong> Dans nos champs à Closel-Bourbon, 2075 Thielle<br><br><strong>Comment ? </strong>Deux heures dans les champs pour se rencontrer et découvrir Rage de vert, ses&nbsp; champs et ses supers maraîcher.e.s (pas le droit de les draguer d'ailleurs). Des tournus pour des activités à deux, et des pauses en groupe.&nbsp;<br>L’évènement est TRES TRES queerfriendly bien sûr.<br><br>Pas besoin d'être membres de Rage de Vert pour participer à cette évent de folie mais attention ça risque de donner envie de s‘abonner. Faites-le savoir autour de vous.<br><br>Pour les intéressés : Envoyer un mail à jardin@ragedevert.ch pour annoncer votre présence ! Ou téléphoner au 076 481 13 84. On se réjouit de vous voir !</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Et si Rage de Vert se prenait un orage de grêle comme Genève le 3 août ?</strong><br>Eh bien ce serait très embêtant. On s'était renseigné dès les débuts de Rage de Vert. Les assurances "grêle" coûtent très chers, d'autant plus cher que l'on prend une franchise basse. D'autre part, une assurance indemnise en argent. Bref, si une grosse partie de nos légumes étaient massacrés par la grêle, on recevrait de l'argent de l'assurance pour aller acheter des légumes ailleurs. Or depuis la création de Rage de Vert, l'idée était de partager avec les membres les risques aussi bien que l'abondance, un peu comme dans un mariage "pour le meilleur et pour le pire" [tout en reconnaissant que personne n'est marié avec Rage de Vert !]. Comme le dit la charte de Rage de Vert: <em>Les fluctuations annuelles dans la production liées aux facteurs externes (climat, ravageurs, etc…) sont communes en agriculture. Les risques de frugalité, ainsi que l’abondance, seront partagés entre les consommateurs et les producteurs</em>. La valeur du contenu des paniers a toujours été supérieure au prix facturé, comme on l'évoquait et l'expliquait dans la Gribouille du 29 juillet. Il n'est pas impossible que lors d'une année catastrophique à cause de la grêle, ce serait une fois le contraire .... Pour limiter la perte, on essaierait de livrer des glaçons pour vos apéros !!</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>tarte aux oignons légumes&nbsp;<br><br>Faire suer les oignons coupé gros avec du cumin et du sel dans la poêle.<br>Précuire un fonds de tarte.<br>Mettre les oignons dessus et finir la cuisson.&nbsp;<br><br>...si jamais vous avez pas assez d'oignon pour toute une tarte, vous pouvez ajouter des tomates.<br><br>Bon app!</div>
