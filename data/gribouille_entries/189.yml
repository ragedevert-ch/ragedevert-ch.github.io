sections_html: |-
  <section id="intro"><div class="trix-content">
    <div>Maître Sam sur le tracteur perché, tenait dans son bec une branche de chocolat.&nbsp;<br>Maître Marion par l'odeur alertée, lui fit une clé de bras. &nbsp;<br>Et d'une seule bouchée, la branche elle avala.&nbsp;<br>miam<br><br>(les 35° tapent sur nos neurones)&nbsp;</div>
  </div>
  </section>
  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>Des carottes bottes&nbsp;<br>De la menthe<br>Une salade&nbsp;<br>des concooooombres&nbsp;<br>des fèves&nbsp;<br>un coulis de tomate (mais c'est la fête ou quoi ?) (avec les tomates de l'année passée, avant les premières tomates, comme c'est bien calculé !)&nbsp;<br>soit des pois-mange-tout, soit des courgettes,soit des brocolis<br><br>/!| il faut nous ramener les bocaux s'il vous plait !&nbsp;</div>
  </div>
  </section>
  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Il fait chaaaaaaaud ! <br><br>On commence plus tôt pour profiter du frais, on se tartine de crème solaire, Sam et Marion portent des casquettes alors qu'ils détestent ça, si ça continue, Cédric mettra même de la crème solaire ! (non) <br><div class="attachment attachment--preview">

    <img alt="IMG_6562.JPG" src="/assets/images/gribouille/189/IMG_6562.JPG">
  </div><br>Ici on tuteure et taille les tomates, avant d'aller faire un plouf dans la Thielle pour se rafraichir.&nbsp;</div>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div>Beaucoup de changements à Rage de vert ! Sam s'est coupé les cheveux, et les tunnels aussi veulent se refaire une beauté, on va donc leur changer les bâches ! après 15 ans (?!) d'utilisation, on voyait plus rien rien à travers ! idéal pour se cacher pour faire pipi, mais ca fait perdre quelques degrés et pas mal de luminosité aux légumes. <br><div class="attachment attachment--preview">

    <img alt="IMG_6555.JPG" src="/assets/images/gribouille/189/IMG_6555.JPG">
  </div><br><br>Mais qui sont ces beaux-gosses qui viennent changer ces bâches par 35° ? C'est grand papa Cédric, et deux abonnés trop sympas ! ensemble, ils s'unissent pour réaliser tous nos rêves c'est magnifique ! regardez comme ils sont contents! <br><div class="attachment attachment--preview">

    <img alt="IMG_6563.JPG" src="/assets/images/gribouille/189/IMG_6563.JPG">
  </div><br><br><div class="attachment attachment--preview">

    <img alt="IMG_6558.JPG" src="/assets/images/gribouille/189/IMG_6558.JPG">
  </div><br>La suite en photo la semaine prochaine !&nbsp;</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div>Heureusement il y a aussi des choses qui ne change pas ! Marion est toujours gaga de son bébé chat, et lui prépare même des courgettes ! <br><div class="attachment attachment--preview">

    <img alt="IMG_6502.jpg" src="/assets/images/gribouille/189/IMG_6502.jpg">
  </div><br>oui, ca veut dire que Cochon a eu des courgettes avant vous. Miaou miaou ( comprenez ici "nananère")&nbsp;</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Petite inspiration pour cuisiner les carottes, en plus ca fait des jolies photos pour frimer sur Instagram. <br><br>faire rôtir les carottes dans du beurre SALé (avec le beurre tout est meilleur, et quand il est salé, c'est encore plus stylé) . saupoudrez de poivre. rajoutez des fleurs d'ail si vous en avez encore. <br><div class="attachment attachment--preview">

    <img alt="IMG_6315.jpg" src="/assets/images/gribouille/189/IMG_6315.jpg">
  </div><br>Présentez ça joli, avec une salade, des lentilles ou autre protéines, et pourquoi un peu de fêta ? <br><div class="attachment attachment--preview">

    <img alt="IMG_6325.jpg" src="/assets/images/gribouille/189/IMG_6325.jpg">
  </div>&nbsp;<br><br>n'hésitez pas aussi à faire un gaspacho avec le coulis de tomates et la menthe j'imagine que c'est délicieux&nbsp;</div>
  </div>
  </section>
