  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Peau de fêve de rêve :<br><br>on a fait un test : Marjan a pris 5 kg de fèves, qu'il a écossées. Devinez combien pèse les fèves après ?&nbsp;<br><br>(on voulait vous mettre la réponse pour vous motiver à faire la recette mais Marjan est déjà parti sans me dire :() en tout cas c'était beaucoup moins ! bref on vous offre une recette pour cuisiner les peaux !!<br><br>Pour cette recette, c'est super important de faire les peaux très rapidement car elles ont très très tendance à s'oxyder très vite.<br><br>- Ecossez vos fêves et séparez les graines des peaux. Ne gardez que les peaux qui sont jolies, bien vertes.<br>- Retirez les bouts des peaux et enlevez sommairement les fils<br>- Coupez les peaux en morceaux de 5cm de long.<br>- Faites revenir des oignons avec du paprika (ou votre épice préférée) dans une casserole. Dès qu'ils frémissent, mouillez un peu d'eau, puis ajoutez de la sauce tomate (ou mieux, des tomates concassées).<br>- Laissez cuire jusqu'à ce que les peaux soient tendre. La mixture doit avoir un consistance de mi-sauce, mi-soupe.<br>- Une fois que c'est prêt, ajoutez du yogourt et mangez !<br><br>Les graines ? C'est le meilleur ! Par exemple : cuire quelques minutes à l'eau jusqu'à tendresse des graines et puis par exemple les poeller avec des fleurs d'ail dans de l'huile d'olive.<br><br></div>
  </div>
  </section>
