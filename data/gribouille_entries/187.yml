  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>On arrive au bout des pois-mangetout gentiment, mais cela est pour mieux laisser place aux premiers concombres et courgettes (bientôt dans vos assiettes). L'herbe pousse super vite ! heureusement, on a Marion qui adoooooooore faire de la débroussailleuse (ah ben ça ça tombe bien alors)<br><br>On vous invite à inviter votre meilleur.e ami.e (ou deuxième meilleur.e ami.e ou troisième ou quatrième ou alors votre super ami.e ? On a pas besoin de classements en fait) à vous accompagner pour votre demi-journée au champs, histoire de leur faire découvrir et qu'ielles nous complimentent... euh qu'ielles passent un super moment. On accueille vos ami.e.s avec plaisir donc &lt;3, merci de prévenir avant si vous venez accompagné.e.s !&nbsp;<br>p.s. si ce ne sont pas des enfants et qu'ils travaillent bien, iels peuvent compter comme une personne !</div>
