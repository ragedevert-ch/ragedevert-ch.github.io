sections_html: |-
  <section id="intro"><div class="trix-content">
    <div>Bonjour cherex supporteurices,<br><br>C'est génial qu'on partage les joies et les risques a ragedevert!<br>...Et que avec du soutien créatif on arrive de faire d'un malheur un bonheur :)<br><br>Tout ca pour vous dire que pendant l'entrainement enthousiaste de tracteur, notre apprenti a confondu la pédale de gaz et de frein et a roulé sur les caisses de la première récolte de tomate 2026. Mais que notre voisin insipiré, Antony, le cuisinier de Perspective Plus vous en a fait des kétchups délicieux :)<br><br>Et a propos soutien.... &lt;3<br><br>- merci a cette belle équipe qui a acomplis la mission renouvellement de bâches de tunnels, et ombrage direct!<br>- merci a ces membres déterminées qui on lancé le début des plantations de poireaux sous la canicule.</div><div><div class="attachment attachment--preview">

    <img alt="IMG_6621.jpg" src="/assets/images/gribouille/190/IMG_6621.jpg">
  </div></div>
  </div>
  </section>
  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>Courgette<br>Concombre<br>Persil ou Basilic<br>Fenouil<br>Ail frais (on peut manger les racines aussi)<br>Salade<br>Ketchup&nbsp;<br>premiers haricots pour certainex<br>cote-de-bette pour certaines<br>premieres tomates pour les grands</div>
  </div>
  </section>
  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>Petit quizzz pour les conaisseureuses de ravageurs: Qui aime trop le chaud et le sec?<br><br>(snorecup sel &lt;---)</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>cazpacho de concombre<br><br>couper des concombre et ajouter&nbsp;<br>de l'ail<br>jus de citron<br>huile d'olive<br>piment<br>poivron (pour plus tard dans la saison :))<br>vieux pain<br>menthe ou basilic&nbsp;<br>glaçons<br>puis si vous n'avez pas encore bu votre coulis de tomate vous pouvez l'ajouter :)<br><br>puis bien mixer tout et bon app</div>
  </div>
  </section>
