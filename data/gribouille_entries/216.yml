sections_html: |-
  <section id="intro"><div class="trix-content">
    <div>Bonjour la punaise ! Bonjour l'autre punaise ! Bonjour l'autre autre punaise ! Oh, bonjour les abonné.e.s, on vous avait pas vu derrière toutes les punaises vertes !<br>On espère que vous allez bien ! Nous ont fait des trucs d'automne, comme vous aussi probablement, comme broyer le maïs et semer des engrais verts par exemple. Maïs qui a été goulument dévoré... par les campagnols qui ont accompli la prouesse de grimper à 1,5m de haut pour manger la case intégralité des beaux épis...<br><div class="attachment attachment--preview">

    <img alt="20260824_140137.jpg" src="/assets/images/gribouille/216/20260824_140137.jpg">
  </div></div>
  </div>
  </section>
  <section id="basket"><h2>Probablement dans votre panier</h2><div class="trix-content">
    <div>Tomate<br>Tomate cerise (pour certain.e.s)<br>Concombre (pour certain.e.s)<br>Colrave (pour certain.e.s)<br>Aubergines (pour certain.e.s)<br>Poivrons<br>Courges (parfois des spaghetti qui attention ! ne se consomme pas super bien en soupe)<br>Courgettes (pour certain.e.s)<br>Scarole platte (pour certain.e.s)<br>Peut être de l'ail</div>
  </div>
  </section>
  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div><div class="attachment attachment--preview">

    <img alt="20260831_165546.jpg" src="/assets/images/gribouille/216/20260831_165546.jpg">
  </div>On a pleins de choses à vous dire !<br>Cette semaine est placée sous le signe du poivron vert. Pourquoi vert et pas rouge, orange, jaune, violet, taupe ? Parce que c'est une super couleur, que c'est bon et aussi car on s'est résolu.e.s à arracher une partie des plants de poivrons et qu'on récolte donc à l'arrachage tous les petits poivrons verts encore dessus. On subit en effet une pression très impressionnante de pectobacterium (une méchante bactérie contre laquelle on n'a aucun moyen d'action (si ce n'est arracher les plantes touchées et les exporter hors des tunnels)). Cette maladie fait des taches grises et très puantes sur les poivrons avant qu'ils murissent et ils deviennent impropres à la consommation. Vous l'aurez peut être compris, c'est à cause de cette bactérie qu'il y a peu de poivrons, d'aubergines et de tomates (même si c'est moins pire dessus) cette année (car cette bactérie s'attaque à plein plein de légumes).&nbsp; Le petit bonus ? Elle s'attaque aussi aux courges et les rend impropre à la garde...<br>Bref, tout ça pour vous dire que cette année, entre punaises, pectobacterium, pucerons et acariens, canicules, canicules, canicules, canicules et canicules on est gâté.e.s en maladies et en ravageurs (certains favorisés par le réchauffement climatique, zut !), ce qui rend en ce moment assez compliqué de vous faire des jolis paniers. En tout cas on fait de notre mieux pour faire dès que possible à des paniers aussi jolis que vous !<br><br>On vous rappelle que ce samedi aura lieu le Greendating de Rage de Vert ! Si vous ou un.e de vos proches à envie de rencontrer des gens ce samedi après midi à Rage de Vert en désherbant en tête à tête, écrivez nous un mail à jardin@ragedevert.ch<br><br>On s'excuse également suite à plusieurs remarques concernant l'intitulé "Probablement dans votre panier" des gribouilles. On nous a fait remarqué qu'il arrivait régulièrement ces derniers temps que la liste de légume ne corresponde pas tout à fait à ce que vous recevez dans le panier. En effet, nous allons essayer d'être plus précis. Cependant, il est tout à fait possible qu'il y ait à nouveau des petites coquilles : comme nous manquons régulièrement d'un type précis de légume pour pouvoir le mettre dans tous les paniers et que des récoltes ont lieu encore le mercredi matin, soit après l'envoi de la gribouille, on est obligé.e.s de réajuster en fonction des récoltes</div>
  </div>
  </section>
  <section id="events"><h2>Événements à venir</h2><div class="trix-content">
    <div><strong>Fête au Jardin de la Main<br></strong>Depuis plusieurs années, nos amis de l'Entraide Protestante animent les "Nouveaux Jardins" au Jardin de la Main, avec un objectif d'intégration par le jardinage. Chaque année, ils organise une fête, et cette fois ce sera le <strong>mercredi 16 septembre dès 17h</strong>. Vous tous qui venez chercher vos légumes au Jardin de la Main, profitez-en pour vous arrêter un moment et discuter avec les gens qui font vivre ces "Nouveaux Jardins". Au programme de la fête: visite du jardin, détente, animations parents-enfants, buffet canadien et bien plus encore ... (voir le flyer en pièce jointe).</div>
  </div>
  </section>
  <section id="rave"><h2>Rage de Vert, c&#39;est qui, c&#39;est quoi, c&#39;est comment ?</h2><div class="trix-content">
    <div><strong>Promo Rage de Vert</strong><br>Vous avez trouvé des auto-collants dans votre panier la semaine dernière, que vous pouvez utiliser avec malice et participer au concours mentionné dans la dernière Gribouille. Vous avez eu accès à des flyers à distribuer (on en a encore). On a mentionné des bâches/drapeaux à mettre bien en vue chez vous (on en a encore à disposition là aussi). Vous avez probablement apprécié leur graphisme. Qui a mis au point ce graphisme avec talent ? C'est l'excellente Siri Johansson, artiste-graphiste, membre de Rage de Vert, et de l'association culturelle du Jardin de la Main.<br><br><strong>Renouvellement de votre abonnement pour 2027</strong><br>Jeudi dernier, vous avez dû recevoir un message indiquant que c'est la saison des renouvellements de votre abonnement à Rage de Vert. <strong>Si vous ne faites rien</strong>, votre abonnement se poursuivra automatiquement en 2027 aux mêmes conditions qu'en 2026. <strong>Si vous ne souhaitez pas poursuivre en 2027</strong>, il faut faire quelque chose: cliquer sur "Non-renouvellement" dans votre page de membre, ou nous faire une communication par email (info@ragedevert.ch) ou par téléphone (076 481 13 84). Et si vous ne poursuivez pas en 2027, expliquez brièvement et sans pitié vos motifs. Cela nous aide à comprendre ce qui peut pécher à Rage de Vert.</div>
  </div>
  </section>
  <section id="recipe"><h2>La recette</h2><div class="trix-content">
    <div>Poivrons verts farcis à la ricotta, cuits au four miam !<br><br>Courge spaghetti cuite à la vapeur , puis enlevée de la peau, puis mélangée à une délicieuse sauce de votre choix (nous on aimerait essayer avec de la fondue)</div>
  </div>
  </section>
