  <section id="echo"><h2>Écho des champs</h2><div class="trix-content">
    <div>C'est gentiment l'automne et la fin des tomates, mais l'arrivée en grande pompe des magnifiques choux de Bruxelles.<br>Et qu'est-ce qu'on fait en automne ? On sème des engrais verts, yeah ! (comme ces bébés seigle en photo)<br><br>Et qu'est-ce qu'on fait d'autre en automne ? On mange des scaroles ! Mais comment manger des scaroles avec plaisir quand on les trouve trop amères ?<br><br>1. On les laisse tremper 30 minutes dans l'eau.<br>2. On met des fruits dans la salade (ou du miel)<br>3. La légende dit qu'on peut les cuire et les manger avec du citron (mais on n'a pas encore testé dans l'équipe, on attend vos retours)<br><div class="attachment attachment--preview">

    <img alt="20261005_082358.jpg" src="/assets/images/gribouille/220/20261005_082358.jpg">
  </div></div>
  </div>
  </section>
