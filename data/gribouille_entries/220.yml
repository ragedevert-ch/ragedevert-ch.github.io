sections_html: |-
  <section id="intro"><div class="trix-content">
    <div>Si vous ne l'avez pas encore fait, n'oubliez pas de faire votre choix dans le "<em>Tour d'engagement</em>" pour lequel vous avez reçu un message spécifique le 1er octobre, portant le titre "<em>Rage de Vert - Une belle histoire qui doit rebondir (suite)</em>" <br>Vous recevrez un message concernant cela dans vos paniers d'ailleurs<br><br><strong>Ou "Rage de Vert - même pas le prix d'un café" !!!</strong><br><br>Il est temps de reprendre notre part de responsabilité dans ce grand projet de Rage de Vert. Il y a 16 ans, une bonne équipe de fous-folles ont écrit un début d’histoire qui liait d’encre la terre et ses occupant-es par une association dans tous les sens du terme. Un lien fort entre des personnes qui ont sorti deux sous de leurs poches et les ont donnés à des maraichers-ères pour qu’ils se lancent dans la production respectueuse de légumes en leur disant : « on va le faire ensemble ». Qu’il vente, qu’il grêle.&nbsp;</div><div>&nbsp;</div><div>Le temps a passé, lentement mais sûrement, des paniers remplis chaque semaine, une terre qui ne s’appauvrit pas. L’habitude s’est insidieusement transformée en un service qu’on paie sans porter le projet, tous ensemble à pleine main.&nbsp;</div><div>&nbsp;</div><div>Mon angoisse, après avoir travaillé et avoir transpiré à grosses gouttes pour ce projet, était que la fatigue gagne petit à petit les maraîcher-ères et que plus personne ne veuille faire ce travail. On est arrivé à ce moment crucial où l’équipe des jardins a mis une limite claire. Nous ne devons pas uniquement respecter la terre, nous devons aussi respecter les personnes qui la travaillent.</div><div>&nbsp;</div><div>La demande de nos maraichers-ères est de pouvoir assurer 4 personnes à 50% toute l’année. Trois maraichers-ères avec un stagiaire, n’est pas viable. Même si on a eu beaucoup de chance avec les stagiaires que nous avons eus-es, on a déjà essayé, et à chaque fois on se dit que ça ne peut pas durer. La responsabilité d’un tel plan de culture sur 4 paires d'épaules fait une grande différence. N’oublions pas en passant, que nous payons ces épaules 20.- et des poussières de l’heure.</div><div>&nbsp;</div><div>Si je regarde réellement ce que j’ai payé pour Rage de Vert en 2026, ça fait 2.- par jour pour mes légumes : 1050.- pour le panier moyen, 336.- pour le bonus maraîchers, et 126.- pour le dépôt. Ce qui fait un total de 1512.- et on est 2 à manger les légumes. Donc 2,10 par jour par personne. Même pas le prix d’un café... Et si tout le monde paie en 2027 environ 2,50 par jour, on devrait arriver à avoir 4 maraîchers.ères pour qui les conditions deviennent acceptable. Alors allons-y et nous pourrons être fier de réellement soutenir un projet durable à la fois pour l’environnement et pour les maraîchers-ères. En espérant que le nombre de membres de Rage de Vert augmente l’année prochaine.&nbsp;</div><div>&nbsp;</div><div>Merci pour votre lecture et toute bonne semaine.</div><div>&nbsp;</div><div>Cédric, ancien maraîcher et actuel membre convaincu.</div><div><br><br></div>
  </div>
  </section>
